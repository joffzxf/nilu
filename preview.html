<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07080a">
  <title>逆旅 · 本机测试</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #07080a; color: #e3b566; }
    body { display: grid; place-items: center; font: 12px/1.8 "Songti SC", "SimSun", serif; letter-spacing: .18em; }
  </style>
</head>
<body>
  <p>TEST</p>
  <script>
    (() => {
      const host = location.hostname;
      const local = ['localhost', '127.0.0.1', '::1', '[::1]'].includes(host)
        || host.startsWith('192.168.')
        || host.startsWith('10.')
        || /^172\.(1[6-9]|2\d|3[01])\./.test(host);
      location.replace(local ? './?test=1' : './');
    })();
  </script>
</body>
</html>
